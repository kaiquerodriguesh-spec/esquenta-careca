<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Esquenta Careca do Seu José 🔥</title><style>html,body{margin:0;min-height:100%;background:#090d1f}body{overflow-x:hidden}iframe{display:block;width:100%;height:100vh;min-height:900px;border:0}</style></head><body><iframe id="gameFrame" src="game.html?v=20260813-4" title="Esquenta Careca"></iframe><script>(function(){const frame=document.getElementById('gameFrame');const trocas={"Isso... continua exatamente assim rs 🔥":"Isso, Kaique... continua exatamente assim rs 🔥","Agora você pegou o jeito da coisa rs 🔥":"Kaique, agora você pegou o jeito da coisa rs 🔥","Pode continuar, não precisa parar agora rs 🔥":"Pode continuar, Kaique... não precisa parar agora rs 🔥","Esse toque aí tá profissional, hein rs 🔥":"Kaique, esse toque aí tá profissional, hein rs 🔥","Continua desse jeitinho que tá bom demais rs 🔥":"Continua desse jeitinho, Kaique... tá bom demais rs 🔥","Rapaz... que mão pesada é essa? rs 🔥":"Kaique... que toque pesado é esse? rs 🔥","Minha careca tá pedindo mais atenção rs 🔥":"Kaique, minha careca tá pedindo mais atenção rs 🔥","Pode tocar um pouquinho mais aí rs 🔥":"Kaique, pode tocar um pouquinho mais aí rs 🔥","Não tenha medo da careca, chega junto rs 🔥":"Kaique, não tenha medo da careca... chega junto rs 🔥","Assim você vai me deixar quente demais rs 🔥":"Kaique, assim você vai me deixar quente demais rs 🔥"};function aplicar(){try{const doc=frame.contentDocument;if(!doc)return;const balao=doc.getElementById('balao');if(!balao||balao.dataset.kaiqueObserver)return;balao.dataset.kaiqueObserver='1';const trocar=()=>{const atual=balao.textContent.trim();if(trocas[atual])balao.textContent=trocas[atual]};trocar();new MutationObserver(trocar).observe(balao,{childList:true,subtree:true,characterData:true})}catch(e){}}frame.addEventListener('load',aplicar);setTimeout(aplicar,1500)})();</script></body></html>
