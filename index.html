<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Esquenta Careca do Seu José 🔥</title><style>html,body{margin:0;min-height:100%;background:#090d1f}body{overflow-x:hidden}iframe{display:block;width:100%;height:100vh;min-height:900px;border:0}#rankBtn{position:fixed;right:18px;top:18px;z-index:9999;border:0;border-radius:999px;padding:11px 16px;background:linear-gradient(135deg,#ffb21a,#f97316);color:#111827;font-weight:1000;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,.35)}#rankOverlay{position:fixed;inset:0;z-index:10000;background:rgba(4,8,18,.84);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px}#rankOverlay.show{display:flex}.rankCard{width:min(94vw,560px);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#202d47,#111a2d);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.55);font-family:Inter,Segoe UI,Tahoma,sans-serif}.rankCard h2{text-align:center;color:#ffb21a;margin:0 0 6px;font-size:1.8rem}.rankSub{text-align:center;color:#94a3b8;font-size:.82rem;margin-bottom:16px}.rankForm{display:flex;gap:8px;margin-bottom:16px}.rankForm input{flex:1;min-width:0;border:1px solid #475569;background:#0b1221;color:#fff;border-radius:12px;padding:12px;font:inherit;outline:none}.rankForm button,.rankClose{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}.rankForm button{background:#ff9f1c;color:#111827}.rankClose{background:#273650;color:#fff;width:100%;margin-top:14px}.myScore{text-align:center;background:#0b1221;border-radius:14px;padding:12px;margin:12px 0;font-weight:900}.rankTable{width:100%;border-collapse:collapse;font-size:.88rem}.rankTable th{color:#94a3b8;font-size:.68rem;text-transform:uppercase;padding:8px;border-bottom:1px solid rgba(255,255,255,.1)}.rankTable td{padding:9px 7px;border-bottom:1px solid rgba(255,255,255,.06)}.rankTable tr.me{background:rgba(255,159,28,.12)}.rankMsg{text-align:center;color:#94a3b8;padding:16px;font-size:.82rem}.loading{opacity:.65;pointer-events:none}</style></head><body><button id="rankBtn">🏆 Ranking mundial</button><iframe id="gameFrame" src="game.html?v=20260813-5" title="Esquenta Careca"></iframe><div id="rankOverlay"><div class="rankCard"><h2>🏆 RANKING MUNDIAL</h2><div class="rankSub">Quem consegue esquentar mais a careca?</div><div id="rankSubmitArea"><div class="rankForm"><input id="rankName" maxlength="20" placeholder="Seu apelido (até 20 caracteres)"><button id="rankSend">ENTRAR NO RANKING 🔥</button></div></div><div id="myScore" class="myScore" style="display:none"></div><div id="rankList" class="rankMsg">Carregando ranking...</div><button class="rankClose" id="rankClose">FECHAR</button></div></div><script>(function(){const frame=document.getElementById('gameFrame');const trocas={"Isso... continua exatamente assim rs 🔥":"Isso, Kaique... continua exatamente assim rs 🔥","Agora você pegou o jeito da coisa rs 🔥":"Kaique, agora você pegou o jeito da coisa rs 🔥","Pode continuar, não precisa parar agora rs 🔥":"Pode continuar, Kaique... não precisa parar agora rs 🔥","Esse toque aí tá profissional, hein rs 🔥":"Kaique, esse toque aí tá profissional, hein rs 🔥","Continua desse jeitinho que tá bom demais rs 🔥":"Continua desse jeitinho, Kaique... tá bom demais rs 🔥","Rapaz... que mão pesada é essa? rs 🔥":"Kaique... que toque pesado é esse? rs 🔥","Minha careca tá pedindo mais atenção rs 🔥":"Kaique, minha careca tá pedindo mais atenção rs 🔥","Pode tocar um pouquinho mais aí rs 🔥":"Kaique, pode tocar um pouquinho mais aí rs 🔥","Não tenha medo da careca, chega junto rs 🔥":"Kaique, não tenha medo da careca... chega junto rs 🔥","Assim você vai me deixar quente demais rs 🔥":"Kaique, assim você vai me deixar quente demais rs 🔥"};function aplicar(){try{const doc=frame.contentDocument;if(!doc)return;const balao=doc.getElementById('balao');if(!balao||balao.dataset.kaiqueObserver)return;balao.dataset.kaiqueObserver='1';const trocar=()=>{const atual=balao.textContent.trim();if(trocas[atual])balao.textContent=trocas[atual]};trocar();new MutationObserver(trocar).observe(balao,{childList:true,subtree:true,characterData:true})}catch(e){}}frame.addEventListener('load',aplicar);setTimeout(aplicar,1500);const SUPABASE_URL='https://vdqtonfedoyczuqfcnma.supabase.co';const SUPABASE_KEY='sb_publishable_keXX6gb7LVTmqNkOkvzTwQ_sQNcujyl';const rankOverlay=document.getElementById('rankOverlay'),rankBtn=document.getElementById('rankBtn'),rankClose=document.getElementById('rankClose'),rankList=document.getElementById('rankList'),rankName=document.getElementById('rankName'),rankSend=document.getElementById('rankSend'),myScore=document.getElementById('myScore');let pendingScore=null;async function api(path,options={}){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}async function carregarRanking(){rankList.innerHTML='<div class="rankMsg">Carregando ranking...</div>';try{const rows=await api('ranking?select=nome,pontos,combo,moscas&order=pontos.desc&limit=10');if(!rows.length){rankList.innerHTML='<div class="rankMsg">Ainda não há pontuações. Seja o primeiro! 🔥</div>';return}rankList.innerHTML='<table class="rankTable"><thead><tr><th>#</th><th>Jogador</th><th>Pontos</th><th>Combo</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td>'+['🥇','🥈','🥉'][i]??(i+1)+'</td><td>'+esc(r.nome)+'</td><td><strong>'+Number(r.pontos).toLocaleString('pt-BR')+'</strong></td><td>x'+Math.floor(r.combo)+'</td></tr>').join('')+'</tbody></table>'}catch(e){rankList.innerHTML='<div class="rankMsg">Não foi possível carregar o ranking agora.<br><small>'+esc(e.message)+'</small></div>'}}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function enviar(){if(!pendingScore)return;let nome=rankName.value.trim().replace(/\s+/g,' ');if(!nome){rankName.focus();return}rankSend.disabled=true;rankSend.textContent='ENVIANDO...';try{await api('ranking',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({nome:nome.slice(0,20),pontos:pendingScore.pontos,combo:pendingScore.combo,moscas:pendingScore.moscas})});myScore.style.display='block';myScore.textContent='🔥 '+nome+' entrou no ranking com '+pendingScore.pontos.toLocaleString('pt-BR')+' pontos!';document.getElementById('rankSubmitArea').style.display='none';await carregarRanking()}catch(e){myScore.style.display='block';myScore.textContent='❌ Não foi possível enviar: '+e.message}finally{rankSend.disabled=false;rankSend.textContent='ENTRAR NO RANKING 🔥'}}function abrirRanking(score){if(score)pendingScore=score;rankOverlay.classList.add('show');if(pendingScore){myScore.style.display='block';myScore.textContent='Sua pontuação: '+pendingScore.pontos.toLocaleString('pt-BR')+' pontos'}else{myScore.style.display='none';document.getElementById('rankSubmitArea').style.display='none'}carregarRanking()}rankBtn.onclick=()=>abrirRanking();rankClose.onclick=()=>rankOverlay.classList.remove('show');rankOverlay.addEventListener('click',e=>{if(e.target===rankOverlay)rankOverlay.classList.remove('show')});function observarFim(){try{const doc=frame.contentDocument;if(!doc)return;const modal=doc.getElementById('modal-fim');if(!modal||modal.dataset.rankObserver)return;modal.dataset.rankObserver='1';let aberto=false;const check=()=>{const vis=!modal.classList.contains('hidden');if(vis&&!aberto){aberto=true;const scoreText=doc.getElementById('fim-score')?.textContent||'0';const comboText=doc.getElementById('fim-combo')?.textContent||'x1';const moscasText=doc.getElementById('fim-moscas')?.textContent||'0';pendingScore={pontos:parseInt(scoreText.replace(/\D/g,''),10)||0,combo:parseInt(comboText.replace(/\D/g,''),10)||1,moscas:parseInt(moscasText.replace(/\D/g,''),10)||0};document.getElementById('rankSubmitArea').style.display='block';rankName.value='';abrirRanking(pendingScore)}if(!vis)aberto=false};new MutationObserver(check).observe(modal,{attributes:true,attributeFilter:['class']});check()}catch(e){}}frame.addEventListener('load',()=>{aplicar();setTimeout(observarFim,500)});setTimeout(observarFim,2500)})();</script></body></html>
