name: Corrigir frases do jogo

on:
  push:
    branches: [main]
    paths:
      - 'game.html'
      - '.github/workflows/corrigir-frases.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Corrigir palavras das frases
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('game.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Pode apertar um pouquinho mais aí rs 🔥', 'Pode tocar um pouquinho mais aí rs 🔥')
          s = s.replace('Kaique, você tá sabendo apertar os botões certos rs 🔥', 'Kaique, você tá sabendo tocar nos botões certos rs 🔥')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Salvar correção
        run: |
          if git diff --quiet; then
            echo 'Nenhuma correção pendente.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.html
          git commit -m 'Corrige frases para usar tocar em vez de apertar'
          git push
