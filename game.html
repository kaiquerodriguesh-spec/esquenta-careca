<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Esquenta Careca 🔥</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:Arial;text-align:center}main{max-width:700px;margin:auto;padding:20px}.card{background:#18233a;border-radius:24px;padding:24px}button{padding:14px 22px;border:0;border-radius:999px;background:#ff9f1c;font-weight:bold;font-size:16px;cursor:pointer}#head{font-size:180px;margin:25px auto;cursor:pointer;filter:drop-shadow(0 10px 15px #000)}#bar{height:24px;background:#334155;border-radius:99px;overflow:hidden}#fill{height:100%;width:15%;background:linear-gradient(90deg,#46a6ff,#ff9f1c,#ff4d5a);transition:.08s}#stats{display:flex;justify-content:space-around;margin:15px 0;font-weight:bold}.bubble{min-height:50px;margin:15px;color:#fde68a;font-weight:bold}.danger{animation:shake .1s infinite}@keyframes shake{from{transform:translateX(2px)}to{transform:translateX(-2px)}}small{color:#94a3b8}</style></head><body><main><div class="card"><h1>🔥 ESQUENTA CARECA DO SEU JOSÉ 🔥</h1><small>Mantenha a careca no ponto certo. Não deixe fritar.</small><div id="stats"><span>⏱️ <b id="time">30</b>s</span><span>🔥 <b id="score">0</b></span><span>⚡ Combo x<b id="combo">1</b></span></div><div class="bubble" id="talk">"Toque mais forte aí, meu filho rs 🔥"</div><div id="head">🧑‍🦲</div><div id="bar"><div id="fill"></div></div><p>🌡️ <b id="temp">15</b>°C — ideal: 50°C a 84°C</p><button id="start">COMEÇAR A FRITURA 🔥</button></div></main><script>let playing=false,t=30,temp=15,score=0,combo=1,timer,decay;const phrases=["Toque mais forte aí, meu filho rs 🔥","Assim tá fraquinho demais, capricha aí rs 🔥","Minha careca tá pedindo mais atenção rs 🔥","Pode apertar um pouquinho mais aí rs 🔥","Não tenha medo da careca, chega junto rs 🔥","Aí sim, meu filho... desse jeito eu gosto rs 🔥","Isso... continua exatamente assim rs 🔥","Que toque gostoso, Kaique rs 🔥","Agora você pegou o jeito da coisa rs 🔥","Nossa... desse jeito até esquenta por dentro rs 🔥","Pode continuar, não precisa parar agora rs 🔥","Assim você vai me deixar quente demais rs 🔥","Esse toque aí tá profissional, hein rs 🔥","Que saudades do Kaique... sempre soube onde tocar rs 🔥","Aí, Kaique... caprichou nesse toque rs 🔥","Isso é que eu chamo de mão pesada rs 🔥","Continua desse jeitinho que tá bom demais rs 🔥","OPA! Desse jeito você vai me deixar pelando rs 🔥","Tá gostoso, mas tá esquentando demais rs 🔥","Meu filho, pega mais leve... ou não rs 🔥","Cuidado com esse toque, a coisa tá ficando quente rs 🔥","Assim você vai acabar me fazendo derreter rs 🔥","Rapaz... que mão pesada é essa? rs 🔥","Não para agora que eu já acostumei rs 🔥","Kaique, você tá sabendo apertar os botões certos rs 🔥","Minha careca nunca recebeu tanta atenção rs 🔥","Tá quente aqui... e a culpa é sua rs 🔥","🚨 KAIQUE, VOCÊ PASSOU DO PONTO! rs 🔥","Minha nossa, que toque foi esse?! rs 🔥","EU TÔ PEGANDO FOGO, MEU FILHO! 🔥","Desse jeito você vai fritar minha careca rs 🔥","ALGUÉM SEGURA O KAIQUE! 🔥","Você não sabe brincar com a temperatura, não? rs 🔥","SOCORRO! ESSA MÃO NÃO TEM FREIO! 🔥","Kaique, chega... minha careca não aguenta mais rs 🔥"];function ui(){document.getElementById('time').textContent=t;document.getElementById('score').textContent=score;document.getElementById('combo').textContent=Math.max(1,Math.floor(combo));document.getElementById('temp').textContent=Math.round(temp);document.getElementById('fill').style.width=temp+'%';document.getElementById('head').classList.toggle('danger',temp>=90);let i=temp>=90?28:temp>=82?17:temp>=50?5:0;document.getElementById('talk').textContent='"'+phrases[i+Math.floor(Math.random()*Math.min(8,phrases.length-i))]+'"'}function start(){playing=true;t=30;temp=15;score=0;combo=1;document.getElementById('start').style.display='none';clearInterval(timer);clearInterval(decay);timer=setInterval(()=>{t--;if(t<=0)end('🏆 MESTRE DA CARECA!');ui()},1000);decay=setInterval(()=>{temp=Math.max(0,temp-2.3);combo=Math.max(1,combo-.1);ui()},120);ui()}function end(msg){playing=false;clearInterval(timer);clearInterval(decay);document.getElementById('start').style.display='inline-block';document.getElementById('start').textContent='JOGAR DE NOVO 🔥';document.getElementById('talk').textContent=msg+' Pontuação: '+score;document.getElementById('head').classList.remove('danger')}document.getElementById('head').onclick=()=>{if(!playing)return;let perfect=Math.random()<.3;temp=Math.min(100,temp+(perfect?12:8));score+=perfect?10*Math.floor(combo):4*Math.floor(combo);combo=Math.min(25,combo+.45);ui();if(temp>=99)end('💥 A CARECA EXPLODIU!')};document.getElementById('start').onclick=start;ui()</script></body></html>
